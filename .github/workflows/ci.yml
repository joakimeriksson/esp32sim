name: ci
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the ESP32-S3, ESP32-C3 and ESP32-C6 mask ROM ELFs
        run: |
          set -e
          url=$(curl -sL --retry 5 --retry-all-errors --retry-delay 5 https://api.github.com/repos/espressif/esp-rom-elfs/releases/latest | python3 -c 'import json,sys; print(next(a["browser_download_url"] for a in json.load(sys.stdin)["assets"] if a["name"].endswith(".tar.gz")))')
          curl -sL --retry 5 --retry-all-errors --retry-delay 5 "$url" -o rom.tar.gz
          mkdir -p roms && tar -xzf rom.tar.gz -C roms --wildcards '*esp32s3_rev0_rom.elf' '*esp32c3_rev3_rom.elf' '*esp32c6_rev0_rom.elf'
          find roms -mindepth 2 -name '*.elf' -exec mv {} roms/ \;
          ls -la roms/*.elf
      - name: Build
        run: cargo build --release --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (hermetic + golden outputs)
        run: ESP32SIM_ROM_DIR=$PWD/roms cargo test --release --workspace -- --include-ignored --skip external_
      - name: Build the wasm module
        run: tools/wasm-build.sh
      - name: Test the wasm module (the real build, under Node, through the page's manifests)
        run: ESP32SIM_ROM_DIR=$PWD/roms node tools/wasm-test.mjs hello c3-hello c6-hello c6-energy-scan c6-contiki c6-contiki-net c6-rpl-net panel
      - name: Worker pacing tests
        run: node tools/worker-pacing-test.mjs
      - name: Differential tests for generated WASM blocks
        run: tools/wasm-jit-test.sh
